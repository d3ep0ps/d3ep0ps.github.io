        ua: { title: "Досить клікати: Шлях до IaC", tags: "cloud · мислення" }
      },
      {
        id: "cloud-firewalls",
        date: "2025-11-17",
        en: { title: "Firewalls in the Cloud: From pf to VPC", tags: "cloud · mindset" },
        ua: { title: "Фаєрволи у хмарі: Від pf до правил VPC", tags: "cloud · мислення" }
      },
      {
        id: "firewall",
        date: "2025-11-13",
        en: { title: "Securing Unix Systems: pf vs iptables", tags: "security · firewalls" },
        ua: { title: "Захист Unix систем: pf проти iptables", tags: "безпека · firewalls" }
      },
      {
        id: "networking-foundations-ipv4-ipv6-linux-freebsd",
        date: "2025-11-11",
        en: { title: "Networking Foundations: IPv4, IPv6", tags: "networking · labs" },
        ua: { title: "Основи мереж: IPv4, IPv6 та конфігурація", tags: "мережі · лаби" }
      },
      {
        id: "text_with_vi",
        date: "2025-11-06",
        en: { title: "Mastering Text Editing on Unix: vi & vim", tags: "hands-on · editing" },
        ua: { title: "Майстерність редагування тексту в Unix", tags: "практика · редагування" }
      },
      {
        id: "linux_vs_freebsd",
        date: "2025-11-04",
        en: { title: "Choosing Your OS: Linux vs FreeBSD", tags: "foundations" },
        ua: { title: "Вибір ОС: Linux проти FreeBSD", tags: "основи" }
      },
      {
        id: "why-i-write",
        date: "2025-11-03",
        en: { title: "Why I Write: From Commands to Cloud", tags: "philosophy · intro" },
        ua: { title: "Чому я пишу: Від командного рядка до хмар", tags: "філософія · інтро" }
      }
    ];

    // Legacy filename mapping (preserved for backward compatibility)
    const legacyMap = {
      "jails_conta": "posts/jails_conta.md",
      "decop": "posts/decop.md",
      "why-i-write": "posts/why-i-write.md",
      "linux_vs_freebsd": "posts/linux_vs_freebsd.md",
      "text_with_vi": "posts/text_with_vi.md",
      "networking-foundations-ipv4-ipv6-linux-freebsd": "posts/networking-foundations-ipv4-ipv6-linux-freebsd.md",
      "firewall": "posts/firewall.md",
      "cloud-firewalls": "posts/cloud_firewalls.md",
      "iac": "posts/iac.md",
      "part1_ansible_ssh": "posts/part1.ansible_ssh.md",
      "part2_ansible_ssh": "posts/part2.ansible_ssh.md",
      "advancedvim": "posts/advancedvim.md",
      "before-containers": "posts/before-containers.md",
      "lamp": "posts/lamp.md",
      "bind": "posts/bind.md",
      "mail": "posts/mail.md",
      "vps": "posts/vps.md"
    };

    // UI strings
    const uiStrings = {
      en: {
        prompt: "$ whoami",
        heroTitle: "Systems, networks, intelligence.",
        heroText: 'I’m <strong>Vitaliy Zhhuta</strong>, a system architect. I run <strong>d3ep0ps</strong> to teach how tech really works — from Linux and FreeBSD to cloud and AI. Depth over hype.',
        search: "Search articles…",
        all: "all",
        back: "← all articles",
        noResults: "Nothing found. Try another search or tag.",
        translationMissing: "UA translation missing. Showing English version.",
        loadError: "Failed to load article"
      },
      ua: {
        prompt: "$ whoami",
        heroTitle: "Системи, мережі, інтелект.",
        heroText: 'Я — <strong>Віталій Жгута</strong>, системний архітектор. Веду <strong>d3ep0ps</strong>, щоб пояснювати, як технології працюють насправді — від Linux і FreeBSD до хмар та AI. Глибина замість хайпу.',
        search: "Пошук статей…",
        all: "всі",
        back: "← всі статті",
        noResults: "Нічого не знайдено. Спробуйте інший запит або тег.",
        translationMissing: "UA-переклад відсутній. Показано англійську версію.",
        loadError: "Не вдалося завантажити статтю"
      }
    };

    // Featured tag chips (filter matches against EN + UA tags)
    const featuredTags = ["security", "gcp", "linux", "freebsd", "networking", "cloud", "ai", "scaling"];
    const tagAliases = {
      security: ["security", "безпека", "hardening", "посилення", "firewalls", "tls"],
      gcp: ["gcp"],
      linux: ["linux", "iptables", "containers", "vim", "neovim", "ansible"],
      freebsd: ["freebsd", "jails", "pf", "famp", "bastille"],
      networking: ["networking", "мережі", "dns", "ingress", "load-balancing", "tls"],
      cloud: ["cloud", "gcp", "iac", "terraform", "k8s"],
      ai: ["ai", "agents", "агенти", "mlops", "mcp", "models", "моделі", "model-armor"],
      scaling: ["scaling", "масштабування", "orchestration", "akf", "architecture", "архітектура"]
    };

    // State
    let currentLang = localStorage.getItem('d3ep0ps_lang') || 'ua';
    let activeTag = null;
    let searchTerm = "";

    const contentContainer = document.getElementById('content-container');

    // --- Views ---

    function renderHome() {
      const s = uiStrings[currentLang];

      const chips = ['<button class="chip' + (activeTag === null ? ' active' : '') + '" onclick="setTag(null)">' + s.all + '</button>']
        .concat(featuredTags.map(t =>
          '<button class="chip' + (activeTag === t ? ' active' : '') + '" onclick="setTag(\'' + t + '\')">' + t + '</button>'
        )).join('');

      contentContainer.innerHTML = `
        <section class="hero">
          <p class="prompt">${s.prompt}</p>
          <h1>${s.heroTitle}</h1>
          <p>${s.heroText}</p>
        </section>
        <div class="filters">
          <div class="search-box">
            <input type="search" id="search" placeholder="${s.search}" value="${escapeAttr(searchTerm)}">
          </div>
          <div class="tag-chips">${chips}</div>
        </div>
        <section class="article-index" id="article-index"></section>
      `;

      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', e => {
        searchTerm = e.target.value;
        renderIndex();
      });

      renderIndex();
      document.title = "d3ep0ps — depth over hype";
    }

    function renderIndex() {
      const listEl = document.getElementById('article-index');
      if (!listEl) return;
      const s = uiStrings[currentLang];
      const term = searchTerm.toLowerCase().trim();

      const rows = articles.filter(article => {
        const meta = article[currentLang] || article.en;
        const haystack = (meta.title + ' ' + meta.tags + ' ' + article.en.tags).toLowerCase();

        if (term && !haystack.includes(term)) return false;

        if (activeTag) {
          const aliases = tagAliases[activeTag] || [activeTag];
          if (!aliases.some(a => haystack.includes(a))) return false;
        }
        return true;
      }).map(article => {
        const meta = article[currentLang] || article.en;
        return `
          <a class="index-row" href="#${article.id}">
            <span class="date">${article.date}</span>
            <div>
              <p class="title">${meta.title}</p>
              <p class="tags">${meta.tags}</p>
            </div>
          </a>`;
      });

      listEl.innerHTML = rows.length ? rows.join('') : `<div class="no-results">${s.noResults}</div>`;
    }

    function setTag(tag) {
      activeTag = tag;
      renderHome();
    }

    function escapeAttr(str) {
      return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('d3ep0ps_lang', lang);

      document.getElementById('btn-ua').classList.toggle('active', lang === 'ua');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');

      if (location.hash && location.hash !== '#') {
        loadArticle(location.hash.substring(1));
      } else {
        renderHome();
      }
    }

    function resetView() {
      activeTag = null;
      searchTerm = "";
      if (location.hash) {
        history.pushState("", document.title, location.pathname + location.search);
      }
      renderHome();
    }

    async function handleHash() {
      const id = location.hash.substring(1);
      if (!id) {
        renderHome();
        return;
      }
      await loadArticle(id);
    }

    async function loadArticle(id) {
      const s = uiStrings[currentLang];
      contentContainer.innerHTML = `<div class="loading">loading…</div>`;
      window.scrollTo(0, 0);

      let path = legacyMap[id] || `posts/${id}.md`;
      if (currentLang === 'ua') {
        path = path.replace('.md', '.ua.md');
      }

      const backLink = `<a class="back-link" href="#" onclick="resetView(); return false;">${s.back}</a>`;

      try {
        const res = await fetch(path);
        if (!res.ok) throw new Error("Not found");
        const text = await res.text();

        contentContainer.innerHTML = `${backLink}<article class="markdown-body">${marked.parse(text)}</article>`;

        const article = articles.find(a => a.id === id);
        if (article) {
          const meta = article[currentLang] || article.en;
          document.title = `${meta.title} | d3ep0ps`;
        }
      } catch (e) {
        if (currentLang === 'ua') {
          try {
            const enPath = legacyMap[id] || `posts/${id}.md`;
            const res = await fetch(enPath);
            if (res.ok) {
              const text = await res.text();
              contentContainer.innerHTML = `${backLink}
                <div class="translation-note">${s.translationMissing}</div>
                <article class="markdown-body">${marked.parse(text)}</article>`;
              return;
            }
          } catch (ex) { }
        }
        contentContainer.innerHTML = `${backLink}<div class="load-error">${s.loadError}: ${id}</div>`;
      }
    }

    // --- Init ---
    window.addEventListener('hashchange', handleHash);
    document.getElementById('btn-ua').classList.toggle('active', currentLang === 'ua');
    document.getElementById('btn-en').classList.toggle('active', currentLang === 'en');

    if (location.hash) {
      handleHash();
    } else {
      renderHome();
    }
  </script>
</body>

</html>
